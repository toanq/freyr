# One public domain (SYNORA_DOMAIN, e.g. synora.id.vn), routed by path:
#   /            landing site (static nginx)            -> landing
#   /app/        web console (static nginx, Vite base)  -> web
#   /downloads/  APK downloads                          -> web
#   /api/*       Synora API, /api stripped               -> server
#                (the landing site calls /api/cms/* -> server /cms/*)
#   /uploads/*   CMS images                             -> server /cms/uploads/*
#   /mqtt        MQTT over WebSocket                    -> mosquitto
# Routing is host-agnostic, so whatever hostname the Cloudflare tunnel sends
# here works the same. Domains come from the traefik service env
# (docker-compose.yml), read via Traefik's {{ env "..." }} templating.
http:
  routers:
    api:
      rule: "PathPrefix(`/api`)"
      entryPoints:
        - web
      service: api
      priority: 10
      middlewares:
        - api-stripprefix
    mqtt:
      rule: "PathPrefix(`/mqtt`)"
      entryPoints:
        - web
      service: mqtt
      priority: 10
    uploads:
      rule: "PathPrefix(`/uploads/`)"
      entryPoints:
        - web
      service: api
      priority: 10
      middlewares:
        - cms-prefix
    console:
      # Not PathPrefix(`/app`) alone -- that would also match e.g. /apple-*.
      rule: "Path(`/app`) || PathPrefix(`/app/`) || PathPrefix(`/downloads`)"
      entryPoints:
        - web
      service: web
      priority: 10
    landing:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: landing
      priority: 1

    # --- Transition from the old domains. Remove these two routers (and the
    # LEGACY_* env on the traefik service) once no installed phone app or
    # field device still uses synora.carcise.dev. ---
    # Old console host: pages move to /app/ on the new domain. /api, /mqtt and
    # /downloads keep being served directly (no redirect) because installed
    # phone apps, devices' MQTT broker URI and the devices' QR code use them.
    legacy-app-pages:
      rule: "Host(`{{ env "LEGACY_APP_DOMAIN" }}`) && !PathPrefix(`/api`) && !PathPrefix(`/mqtt`) && !PathPrefix(`/downloads`)"
      entryPoints:
        - web
      service: web
      priority: 50
      middlewares:
        - legacy-app-redirect
    # Old landing host: everything moves to the same path on the new domain.
    legacy-landing:
      rule: "Host(`{{ env "LEGACY_LANDING_DOMAIN" }}`)"
      entryPoints:
        - web
      service: landing
      priority: 50
      middlewares:
        - legacy-landing-redirect

  middlewares:
    api-stripprefix:
      stripPrefix:
        prefixes:
          - /api
    # /uploads/<file> -> /cms/uploads/<file>
    cms-prefix:
      addPrefix:
        prefix: /cms
    legacy-app-redirect:
      redirectRegex:
        regex: "^https?://[^/]+/(.*)"
        replacement: "https://{{ env "SYNORA_DOMAIN" }}/app/${1}"
        permanent: true
    legacy-landing-redirect:
      redirectRegex:
        regex: "^https?://[^/]+/(.*)"
        replacement: "https://{{ env "SYNORA_DOMAIN" }}/${1}"
        permanent: true

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://server:8080"
    mqtt:
      # Mosquitto's websockets listener (mosquitto.conf) doesn't do its own
      # path routing -- no stripPrefix needed, Traefik just proxies the
      # WebSocket upgrade through as-is (standard Traefik behavior, no
      # special config required for WS).
      loadBalancer:
        servers:
          - url: "http://mosquitto:9001"
    landing:
      loadBalancer:
        servers:
          - url: "http://landing:80"
    web:
      loadBalancer:
        servers:
          - url: "http://web:80"
