http:
  routers:
    api:
      rule: "PathPrefix(`/api`)"
      entryPoints:
        - web
      service: api
      priority: 10
      middlewares:
        - api-stripprefix
    mqtt:
      rule: "PathPrefix(`/mqtt`)"
      entryPoints:
        - web
      service: mqtt
      priority: 10
    # Landing site: nginx serves only the static build; its API and uploaded
    # images are the Synora server's /cms/* endpoints, routed here.
    # LANDING_DOMAIN comes from the traefik service env (docker-compose.yml),
    # e.g. synora-landing.carcise.dev.
    landing-api:
      rule: "Host(`{{ env "LANDING_DOMAIN" }}`) && PathPrefix(`/api/`)"
      entryPoints:
        - web
      service: api
      priority: 30
      middlewares:
        - landing-api-to-cms
    landing-uploads:
      rule: "Host(`{{ env "LANDING_DOMAIN" }}`) && PathPrefix(`/uploads/`)"
      entryPoints:
        - web
      service: api
      priority: 30
      middlewares:
        - cms-prefix
    landing:
      rule: "Host(`{{ env "LANDING_DOMAIN" }}`)"
      entryPoints:
        - web
      service: landing
      priority: 20
    web:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: web
      priority: 1

  middlewares:
    api-stripprefix:
      stripPrefix:
        prefixes:
          - /api
    # /api/<path> -> /cms/<path>
    landing-api-to-cms:
      replacePathRegex:
        regex: "^/api/(.*)"
        replacement: "/cms/$1"
    # /uploads/<file> -> /cms/uploads/<file>
    cms-prefix:
      addPrefix:
        prefix: /cms

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://server:8080"
    mqtt:
      # Mosquitto's websockets listener (mosquitto.conf) doesn't do its own
      # path routing -- no stripPrefix needed, Traefik just proxies the
      # WebSocket upgrade through as-is (standard Traefik behavior, no
      # special config required for WS).
      loadBalancer:
        servers:
          - url: "http://mosquitto:9001"
    landing:
      loadBalancer:
        servers:
          - url: "http://landing:80"
    web:
      loadBalancer:
        servers:
          - url: "http://web:80"
