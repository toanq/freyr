<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Synora — Download</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0e2418;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { margin-bottom: 4px; }
  p.sub { color: #9fb8ac; margin-top: 0; }
  .card {
    background: #15301f;
    border-radius: 20px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    margin-top: 24px;
  }
  a.download {
    display: block;
    background: #6fcf97;
    color: #0e2418;
    text-decoration: none;
    font-weight: 600;
    text-align: center;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  a.download:last-child { margin-bottom: 0; }
  a.download small { display: block; font-weight: 400; opacity: 0.75; }
</style>
</head>
<body>
  <h1>Synora</h1>
  <p class="sub">Tải ứng dụng Android</p>
  <div class="card">
    <a class="download" href="/downloads/release">
      Tải ứng dụng Synora
      <small>Đã tối ưu, khuyến nghị cho hầu hết người dùng</small>
    </a>
  </div>
</body>
</html>
