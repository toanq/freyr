server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: behind Cloudflare + Traefik nginx only sees
    # plain http, so an absolute redirect would point at http://.
    absolute_redirect off;

    # The console is built with Vite base /app/ and copied to html/app/ (the
    # landing site owns / on the shared domain). Traefik only sends /app/* and
    # /downloads/* here.
    location = / {
        return 302 /app/;
    }
    location = /app {
        return 301 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Must revalidate so installed PWAs pick up a redeploy instead of running
    # the old service worker / shell indefinitely.
    location = /app/sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /app/index.html {
        add_header Cache-Control "no-cache";
    }

    location = /app/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Extension-less APK downloads -- default_type/Content-Disposition give
    # them the right MIME type and a proper .apk filename on save, since the
    # URL itself intentionally has no extension. Kept at /downloads/ (not under
    # /app/) so links and the device's QR code stay short and stable.
    location = /downloads/dev {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="synora-dev.apk"';
    }
    location = /downloads/release {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="synora-release.apk"';
    }
}
