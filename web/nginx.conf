server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Extension-less APK downloads -- default_type/Content-Disposition give
    # them the right MIME type and a proper .apk filename on save, since the
    # URL itself intentionally has no extension.
    location = /downloads/dev {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="synora-dev.apk"';
    }
    location = /downloads/release {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="synora-release.apk"';
    }
}
