name: Build iOS App

# Builds the Flutter app (app/) for iOS, unsigned, and packages it as an
# unsigned .ipa for sideloading (e.g. via Sideloadly, which re-signs the .ipa
# itself using your own Apple ID at install time -- so CI never needs real
# Apple Developer certs/provisioning profiles for this use case). Requires a
# self-hosted runner on macOS with Xcode + Homebrew already installed --
# iOS builds can't run on GitHub-hosted Linux/Windows runners. CocoaPods
# itself is installed by the workflow if missing (see that step below).
#
# This does NOT produce something uploadable to TestFlight/the App Store --
# that needs real code signing (Apple Developer cert + provisioning profile,
# likely via fastlane match or manual secrets), a separate follow-up.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-ios.yml"
  pull_request:
    paths:
      - "app/**"
  workflow_dispatch:

jobs:
  build-ios:
    # GitHub auto-assigns these three labels to a self-hosted Apple Silicon
    # macOS runner (Settings -> Actions -> Runners shows the exact set) --
    # adjust if yours differ.
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Flutter needs a FULL Xcode, not just the Command Line Tools. This
      # runner had `xcode-select -p` pointing at /Library/Developer/
      # CommandLineTools, which has no `xcodebuild` -- and Flutter degrades
      # silently rather than loudly in that state. Both symptoms we chased
      # trace back here: it skips writing ios/Podfile (-> "No `Podfile'
      # found") and it can't resolve the bundle identifier (-> "Application
      # not configured for iOS"), because each needs `xcodebuild
      # -showBuildSettings`.
      #
      # DEVELOPER_DIR overrides the xcode-select choice for this job only, so
      # we can point at Xcode without sudo on the machine-wide setting.
      # Second gap, same spirit: Xcode 15+ ships WITHOUT platform SDKs, so a
      # freshly installed Xcode can run `xcodebuild -version` yet still have
      # no iOS platform. That surfaces late and confusingly, as "Unable to
      # find a destination matching { generic:1, platform:iOS }" with
      # "iOS <ver> is not installed" buried in the ineligible-destination
      # list. Checking for the iphoneos SDK up front turns that into a
      # one-line fix. Like Homebrew and Xcode above, we tell rather than
      # install: it's a multi-GB one-time machine-setup download, not
      # something to re-run every build.
      - name: Ensure a full Xcode is selected
        run: |
          set -euo pipefail

          if [ -z "${DEVELOPER_DIR:-}" ]; then
            for xcode_app in /Applications/Xcode*.app; do
              if [ -x "$xcode_app/Contents/Developer/usr/bin/xcodebuild" ]; then
                export DEVELOPER_DIR="$xcode_app/Contents/Developer"
                echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
                break
              fi
            done
          fi

          if ! xcodebuild -version; then
            echo "Xcode apps present: $(ls -d /Applications/Xcode*.app 2>/dev/null || echo none)"
            echo "::error::No usable Xcode on this self-hosted runner (xcode-select -p = $(xcode-select -p)). Install Xcode from the App Store, then run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer && sudo xcodebuild -runFirstLaunch"
            exit 1
          fi

          if ! xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
            echo "::error::Xcode is installed but its iOS platform SDK is not. On the runner run: sudo xcodebuild -downloadPlatform iOS"
            exit 1
          fi

      - name: flutter pub get
        run: flutter pub get

      # Self-hosted runners are BYO-toolchain: nothing is pre-provisioned, and
      # a fresh Mac has no `pod`. Two things bite here:
      #
      #  1. PATH. Actions runs each step in a non-login, non-interactive shell,
      #     which does NOT source ~/.zprofile -- where Homebrew's `shellenv`
      #     line normally lives. So even with Homebrew installed, `brew` (and
      #     therefore `pod`) can be missing from PATH. We source shellenv
      #     explicitly. Apple Silicon puts Homebrew in /opt/homebrew, not the
      #     Intel /usr/local -- we try both so the workflow isn't arch-locked.
      #  2. Install method. Do NOT use `sudo gem install cocoapods`: macOS
      #     system Ruby is deprecated, read-only (Gem::FilePermissionError),
      #     and its ffi build is unreliable on arm64. `brew install cocoapods`
      #     is the recommended route on Apple Silicon -- it ships a
      #     self-contained Ruby and needs no sudo.
      #
      # ASSUMPTION: Homebrew is already installed on the runner. We fail loudly
      # rather than bootstrapping it, since installing Homebrew needs sudo and
      # is a one-time machine-setup task, not a per-build one.
      - name: Ensure CocoaPods is installed
        run: |
          set -euo pipefail

          if ! command -v brew >/dev/null 2>&1; then
            for brew_bin in /opt/homebrew/bin/brew /usr/local/bin/brew; do
              if [ -x "$brew_bin" ]; then
                eval "$("$brew_bin" shellenv)"
                break
              fi
            done
          fi

          if ! command -v brew >/dev/null 2>&1; then
            echo "::error::Homebrew not found on this self-hosted runner. Install it (https://brew.sh) and re-run."
            exit 1
          fi

          # Persist Homebrew's bin dir for every later step in this job.
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

          if command -v pod >/dev/null 2>&1; then
            echo "CocoaPods already present: $(pod --version)"
          else
            brew install cocoapods
          fi

      # `app/ios/Podfile` is NOT in the repo, and that's normal: `flutter
      # create` doesn't emit one. The Flutter tool writes it lazily, together
      # with Generated.xcconfig and GeneratedPluginRegistrant, the first time
      # it generates the iOS platform config -- which `flutter pub get` alone
      # does not reliably do. `--config-only` does exactly that generation and
      # then stops short of xcodebuild, so the `pod install` below has a
      # Podfile to work from (previously it hit "No `Podfile' found").
      - name: Generate iOS platform config (writes ios/Podfile)
        run: flutter build ios --config-only --release --no-codesign

      - name: pod install
        run: pod install --repo-update
        working-directory: app/ios

      - name: flutter build ios (unsigned)
        run: flutter build ios --release --no-codesign

      # flutter build ipa requires real export-signing config, which this
      # repo doesn't have -- pack the unsigned .app into a standard IPA
      # (Payload/Runner.app, zipped) by hand instead. This is exactly the
      # .ipa shape Sideloadly/AltStore expect as input.
      - name: Package unsigned .ipa
        run: |
          set -e
          rm -rf Payload
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          rm -f build/ios/iphoneos/Runner.ipa
          zip -r build/ios/iphoneos/Runner.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: app/build/ios/iphoneos/Runner.ipa
          if-no-files-found: error
