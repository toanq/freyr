name: Build Docker Images

# Builds and publishes multi-arch (amd64 + arm64) images for every
# buildable service in docker-compose.yml whenever master gets a new
# commit touching that service's directory. Images are pushed to GHCR
# under ghcr.io/<repo>/<service>, tagged with the branch, short SHA,
# and `latest`. No extra secrets needed -- uses the built-in
# GITHUB_TOKEN with packages:write.
on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "asr/**"
      - "tts/**"
      - "web/**"
      - "landing/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./server
            dockerfile: ./server/Synora.Api/Dockerfile
          - name: asr
            context: ./asr
            dockerfile: ./asr/Dockerfile
          - name: tts
            context: ./tts
            dockerfile: ./tts/Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: landing
            context: ./landing
            dockerfile: ./landing/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
