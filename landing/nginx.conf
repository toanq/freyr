server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static build only. /api/* and /uploads/* never reach this container in
    # production: Traefik routes them to the Synora server's /cms/* endpoints
    # (see traefik/dynamic.yml).

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sign-in entry point: the web console (/app/) shows its login screen when
    # signed out, or the user's devices / admin tools when already signed in.
    # Relative Location so the scheme/host the client used (https via the LAN
    # proxy) is kept.
    absolute_redirect off;
    location = /login {
        return 302 /app/;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed filenames under /assets -- safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
