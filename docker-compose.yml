services:
  traefik:
    image: traefik:v3.5
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports:
      - "80:80"
      # Dashboard is unauthenticated (--api.insecure) -- loopback only, reach it
      # from elsewhere via `ssh -L 8080:127.0.0.1:8080 <host>`.
      - "127.0.0.1:8080:8080"
    environment:
      # Read by traefik/dynamic.yml's {{ env "..." }} templates.
      SYNORA_DOMAIN: ${SYNORA_DOMAIN:-synora.id.vn}
      # Old hosts, redirected to SYNORA_DOMAIN except /api, /mqtt, /downloads
      # on the old app host (installed phone apps and field devices use them).
      LEGACY_APP_DOMAIN: ${LEGACY_APP_DOMAIN:-synora.carcise.dev}
      LEGACY_LANDING_DOMAIN: ${LEGACY_LANDING_DOMAIN:-synora-landing.carcise.dev}
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro

  server:
    build:
      context: ./server
      dockerfile: Synora.Api/Dockerfile
    env_file:
      - .env
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=synora;Username=synora;Password=${POSTGRES_PASSWORD:-synora_dev}"
      Avatar__StoragePath: "/data/avatars"
      Recordings__StoragePath: "/data/recordings"
      MicTestUploads__StoragePath: "/data/mictest"
      Firmware__StoragePath: "/data/firmware"
      # Public hostname (see .env.example), e.g. synora.id.vn -- landing at /,
      # console at /app/, API at /api.
      Domain__App: ${SYNORA_DOMAIN:-synora.id.vn}
      # Optional OTA download base URL override; empty -> https://<Domain__App>/api.
      Firmware__PublicBaseUrl: ${FIRMWARE_PUBLIC_BASE_URL:-}
      # Landing-site CMS (/cms/*): uploaded images, plus the one-time import
      # source -- the former Rust CMS's SQLite DB + uploads, read-only.
      Cms__UploadsPath: "/data/cms-uploads"
      Cms__LegacySqlitePath: "/data/landing-legacy/synora_cms.sqlite3"
      # Any OpenAI-compatible chat-completions backend works (DeepSeek direct
      # by default; set LLM_BASE_URL/LLM_MODEL to switch, e.g. to OpenRouter:
      # LLM_BASE_URL=https://openrouter.ai/api/v1, LLM_MODEL=deepseek/deepseek-chat).
      Llm__BaseUrl: ${LLM_BASE_URL:-https://api.deepseek.com}
      Llm__Model: ${LLM_MODEL:-deepseek-chat}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Mqtt__Host: mosquitto
      Mqtt__Port: 1883
      Mqtt__Username: ${MQTT_USERNAME:-synora_device}
      Mqtt__Password: ${MQTT_PASSWORD:-synora_mqtt_dev}
      Asr__BaseUrl: http://asr:8000
      Tts__BaseUrl: http://tts:8000
    volumes:
      - ./server/data/avatars:/data/avatars
      - ./server/data/recordings:/data/recordings
      - ./server/data/mictest:/data/mictest
      - ./server/data/firmware:/data/firmware
      - ./server/data/cms-uploads:/data/cms-uploads
      # Former landing CMS data volume, only read by the startup import
      # (no-op once the CMS tables have rows). Safe to drop after migrating.
      - synora-landing-api-data:/data/landing-legacy:ro
    depends_on:
      - postgres
      - mosquitto
      - asr
      - tts

  asr:
    build:
      context: ./asr
    volumes:
      # Model weights (several hundred MB, converted to CTranslate2 on first
      # startup -- see entrypoint.sh) persist here across restarts/rebuilds.
      - synora-asr-models:/models
      # Pre-downloaded vinai/PhoWhisper-small checkpoint (host-side download,
      # see asr/download_model.py) -- the in-container download of this same
      # checkpoint stalled completely partway through (a silent hang, not
      # just slow), matching this environment's known CDN-egress issue with
      # large files from inside containers. entrypoint.sh converts from this
      # local copy instead of letting ct2-transformers-converter fetch it
      # from HuggingFace itself.
      - ./asr/model-src:/model-src:ro

  tts:
    build:
      context: ./tts
    environment:
      # Points vieneu's own huggingface_hub calls at the bind-mounted,
      # host-pre-downloaded cache below instead of hitting the network --
      # see tts/download_vieneu_model.py for why (same in-container
      # CDN-egress issue as asr/model-src).
      HF_HUB_CACHE: /hf-cache
    volumes:
      # NOT :ro (unlike asr/model-src above) -- huggingface_hub writes lock
      # files and cache-index metadata into HF_HUB_CACHE even when the model
      # is already fully downloaded. Read-only here made the container
      # crash on every startup: "OSError: [Errno 30] Read-only file system:
      # '/hf-cache/models--pnnbao-ump--VieNeu-TTS-v3-...'" (confirmed live,
      # container down since boot until this fix).
      - ./tts/vieneu-hf-cache:/hf-cache

  mosquitto:
    image: eclipse-mosquitto:2
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-synora_device}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-synora_mqtt_dev}
    # The stock image's entrypoint just execs `mosquitto` -- overridden here
    # so a mosquitto_passwd credentials file is (re)generated from
    # MQTT_USERNAME/MQTT_PASSWORD on every start, before mosquitto itself
    # starts. Dev/bench convenience over the "bake a fixed passwd file into
    # the image/repo" alternative, at the cost of re-hashing on every
    # container start (negligible cost, and the mounted mosquitto.conf below
    # is read-only, not the whole /mosquitto/config directory, so writing the
    # passwd file next to it still works).
    entrypoint:
      - /bin/sh
      - -c
      - |
        mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/config/passwd
        chmod 0700 /mosquitto/config/passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - synora-mosquitto-data:/mosquitto/data
    ports:
      - "1883:1883"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: /api
        # Baked into the build (see .env.example); empty hides the button.
        VITE_GOOGLE_CLIENT_ID: ${OAuth__Google__WebClientId:-}
        VITE_FACEBOOK_APP_ID: ${OAuth__Facebook__AppId:-}
        # Web push (see .env.example); any empty value hides the opt-in.
        VITE_FIREBASE_API_KEY: ${FIREBASE_WEB_API_KEY:-}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_WEB_PROJECT_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_WEB_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${FIREBASE_WEB_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${FIREBASE_WEB_VAPID_KEY:-}
    volumes:
      - ./web/downloads:/usr/share/nginx/html/downloads
    depends_on:
      - server

  # Static landing site (nginx) at / on the shared domain. It calls the CMS at
  # /api/cms/* and loads images from /uploads/*; Traefik routes both to the
  # server's /cms/* endpoints (see traefik/dynamic.yml). Admin login uses
  # Synora Admin/SuperAdmin accounts.
  landing:
    build:
      context: ./landing
      args:
        VITE_API_URL: /api/cms

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Remotely-managed tunnel (token-based) -- ingress rules (which public
    # hostname maps to which local address, e.g. synora.id.vn -> http://traefik:80,
    # plus the old synora.carcise.dev / synora-landing.carcise.dev during the
    # transition) live in the Cloudflare dashboard for this tunnel, not in a
    # local config.yml. Phone apps built before the move are hardcoded to
    # https://synora.carcise.dev/api; Traefik keeps serving that host's /api.
    # --protocol http2 forces TCP-based edge connections instead of QUIC
    # (cloudflared's default) -- QUIC (UDP) was dropping connIndex=3 every
    # 20-100s in this Docker setup ("control stream encountered a failure
    # while serving" / datagram handler context canceled), which caused the
    # MQTT-over-WSS disconnects noted in synora_mqtt.h/test_console.cc.
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - traefik

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: synora
      POSTGRES_USER: synora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synora_dev}
    volumes:
      - synora-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  synora-postgres-data:
  synora-mosquitto-data:
  synora-asr-models:
  synora-landing-api-data:
