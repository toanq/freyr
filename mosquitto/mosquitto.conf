# Mosquitto config for the Synora device<->server MQTT link (telemetry,
# device-trust-model commands/state, voice control/audio). Dev/bench setup --
# plain MQTT on 1883 with username/password auth (not anonymous), no TLS.
# TLS (8883) and finer-grained per-device credentials are future hardening
# work, not required for this environment.
#
# The password file itself isn't checked in: docker-compose.yml's mosquitto
# service entrypoint (re)generates /mosquitto/config/passwd from the
# MQTT_USERNAME/MQTT_PASSWORD env vars on every container start via
# `mosquitto_passwd -b -c`, so this conf only points at the file location.

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd

# WebSocket listener so MQTT can ride through the same Traefik+Cloudflare
# HTTP(S) path already used for the REST API (see traefik/dynamic.yml's
# "mqtt" router) -- devices out on the public internet can't resolve the
# "mosquitto" compose-network hostname or reach port 1883 directly, but they
# can already reach https://synora.id.vn/api (and, during the move, the old
# synora.carcise.dev), so MQTT-over-WSS through
# the same tunnel needs no new public exposure.
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
